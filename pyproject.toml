[project]
name = "bef-gat-research"
version = "0.1.0"
description = "BEF-GAT: Bounded-Error Freezing for Graph Attention Networks"
dependencies = [
    "torch>=1.9.0",
    "torch-geometric>=2.0.0",
    "pynvml>=11.0.0",
    "PyYAML>=6.0",
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "scikit-learn>=1.0.0",
    "tqdm>=4.60.0"
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
